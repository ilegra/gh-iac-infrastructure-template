name: Github infrastructure pipeline

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module/unit to apply (or "all" for the entire organization)'
        required: true
        type: choice
        default: 'all'
        options:
          - 'all'
          - 'org/settings'
          - 'org/teams'
          - 'org/rulesets'
          - 'org/repositories'
          - 'org/repositories/group-1'
          - 'org/repositories/group-2'
      action:
        description: 'Terraform action to perform'
        required: true
        type: choice
        default: 'apply'
        options:
          - 'apply'
          - 'plan'
          - 'destroy'

concurrency:
  group: terragrunt-pipeline
  cancel-in-progress: false

jobs:
  terragrunt:
    name: Terragrunt ${{ inputs.action }} (${{ inputs.module }})
    runs-on: ubuntu-26.04
    permissions:
      contents: read

    env:
      GITHUB_OWNER: ${{ vars.GITHUB_OWNER || vars.GITHUB_ORG || vars.ORG_OWNER || secrets.GITHUB_OWNER || secrets.GITHUB_ORG || secrets.ORG_OWNER }}
      GITHUB_ORG: ${{ vars.GITHUB_OWNER || vars.GITHUB_ORG || vars.ORG_OWNER || secrets.GITHUB_OWNER || secrets.GITHUB_ORG || secrets.ORG_OWNER }}
      ORG_OWNER: ${{ vars.GITHUB_OWNER || vars.GITHUB_ORG || vars.ORG_OWNER || secrets.GITHUB_OWNER || secrets.GITHUB_ORG || secrets.ORG_OWNER }}
      GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID || vars.INFRA_APP_ID || secrets.GITHUB_APP_ID || secrets.INFRA_APP_ID }}
      INFRA_APP_ID: ${{ vars.GITHUB_APP_ID || vars.INFRA_APP_ID || secrets.GITHUB_APP_ID || secrets.INFRA_APP_ID }}
      GITHUB_APP_INSTALLATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID || vars.INFRA_APP_INSTALLATION_ID || vars.INFRA_APP_INSTALATION_ID || secrets.GITHUB_APP_INSTALLATION_ID || secrets.INFRA_APP_INSTALLATION_ID || secrets.INFRA_APP_INSTALATION_ID }}
      INFRA_APP_INSTALLATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID || vars.INFRA_APP_INSTALLATION_ID || vars.INFRA_APP_INSTALATION_ID || secrets.GITHUB_APP_INSTALLATION_ID || secrets.INFRA_APP_INSTALLATION_ID || secrets.INFRA_APP_INSTALATION_ID }}
      INFRA_APP_INSTALATION_ID: ${{ vars.GITHUB_APP_INSTALLATION_ID || vars.INFRA_APP_INSTALLATION_ID || vars.INFRA_APP_INSTALATION_ID || secrets.GITHUB_APP_INSTALLATION_ID || secrets.INFRA_APP_INSTALLATION_ID || secrets.INFRA_APP_INSTALATION_ID }}
      GITHUB_BILLING_EMAIL: ${{ vars.GITHUB_BILLING_EMAIL || vars.ORG_BILLING_EMAIL || secrets.GITHUB_BILLING_EMAIL || secrets.ORG_BILLING_EMAIL }}
      ORG_BILLING_EMAIL: ${{ vars.GITHUB_BILLING_EMAIL || vars.ORG_BILLING_EMAIL || secrets.GITHUB_BILLING_EMAIL || secrets.ORG_BILLING_EMAIL }}
      GITHUB_EMAIL: ${{ vars.GITHUB_EMAIL || vars.ORG_EMAIL || secrets.GITHUB_EMAIL || secrets.ORG_EMAIL }}
      ORG_EMAIL: ${{ vars.GITHUB_EMAIL || vars.ORG_EMAIL || secrets.GITHUB_EMAIL || secrets.ORG_EMAIL }}
      GITHUB_ORG_NAME: ${{ vars.GITHUB_ORG_NAME || vars.ORG_NAME || secrets.GITHUB_ORG_NAME || secrets.ORG_NAME }}
      ORG_NAME: ${{ vars.GITHUB_ORG_NAME || vars.ORG_NAME || secrets.GITHUB_ORG_NAME || secrets.ORG_NAME }}
      GITHUB_COMPANY: ${{ vars.GITHUB_COMPANY || vars.ORG_COMPANY || secrets.GITHUB_COMPANY || secrets.ORG_COMPANY }}
      ORG_COMPANY: ${{ vars.GITHUB_COMPANY || vars.ORG_COMPANY || secrets.GITHUB_COMPANY || secrets.ORG_COMPANY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6
          terraform_wrapper: false

      - name: Setup Terragrunt
        uses: autero1/action-terragrunt@v3
        with:
          terragrunt-version-file: .terragrunt-version
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure GitHub App Private Key
        env:
          GH_APP_KEY: ${{ secrets.INFRA_APP_PRIVATE_KEY || secrets.INFRA_APP_PRIVATE__KEY || secrets.GH_APP_PRIVATE_KEY || secrets.GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$GH_APP_KEY" ]; then
            echo "::error::Missing GitHub App private key secret (INFRA_APP_PRIVATE_KEY or INFRA_APP_PRIVATE__KEY)."
            echo "Please configure it in GitHub Repository Settings -> Secrets and variables -> Actions -> Secrets."
            exit 1
          fi
          # Write private key with restricted file permissions
          printf "%s\n" "$GH_APP_KEY" > github-app-private-key.pem
          chmod 600 github-app-private-key.pem
          echo "GitHub App private key configured successfully."

      - name: Resolve Target Directory
        id: resolve
        run: |
          RAW_MODULE="${{ inputs.module }}"

          if [ "$RAW_MODULE" = "all" ]; then
            TARGET_PATH="org"
          else
            TARGET_PATH="$RAW_MODULE"
          fi

          if [ ! -d "$TARGET_PATH" ]; then
            echo "::error::Target directory '$TARGET_PATH' does not exist in repository."
            exit 1
          fi

          if [ -f "$TARGET_PATH/terragrunt.hcl" ]; then
            IS_SINGLE_UNIT="true"
          else
            IS_SINGLE_UNIT="false"
          fi

          echo "target_path=$TARGET_PATH" >> "$GITHUB_OUTPUT"
          echo "is_single_unit=$IS_SINGLE_UNIT" >> "$GITHUB_OUTPUT"

          echo "Selected Target Path: $TARGET_PATH"
          echo "Execution Mode: $([ "$IS_SINGLE_UNIT" = "true" ] && echo "Single Unit" || echo "Stack (--all)")"
          echo "Action: ${{ inputs.action }}"

      - name: Run Terragrunt
        id: terragrunt
        env:
          TARGET_PATH: ${{ steps.resolve.outputs.target_path }}
          IS_SINGLE_UNIT: ${{ steps.resolve.outputs.is_single_unit }}
          ACTION: ${{ inputs.action }}
        run: |
          set -euo pipefail

          EXTRA_ARGS="-input=false"
          if [ "$ACTION" = "apply" ] || [ "$ACTION" = "destroy" ]; then
            EXTRA_ARGS="-auto-approve $EXTRA_ARGS"
          fi

          RUN_ALL_FLAG=""
          if [ "$IS_SINGLE_UNIT" != "true" ]; then
            RUN_ALL_FLAG="--all"
          fi

          echo "::group::Running Terragrunt ($ACTION, single_unit=$IS_SINGLE_UNIT)"
          terragrunt run $RUN_ALL_FLAG "$ACTION" --non-interactive --working-dir "$TARGET_PATH" -- $EXTRA_ARGS
          echo "::endgroup::"

      - name: Generate Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## 🚀 Terragrunt Execution Summary

          - **Action**: \`${{ inputs.action }}\`
          - **Module Selected**: \`${{ inputs.module }}\`
          - **Target Directory**: \`${{ steps.resolve.outputs.target_path || 'N/A' }}\`
          - **Execution Mode**: \`${{ steps.resolve.outputs.is_single_unit == 'true' && 'Single Unit' || 'All Units (Stack)' }}\`
          - **Organization**: \`${ORG_OWNER:-N/A}\`
          - **App ID**: \`${INFRA_APP_ID:-N/A}\`
          - **Status**: ${{ job.status == 'success' && '✅ Succeeded' || '❌ Failed' }}

          ---
          *Triggered manually via workflow_dispatch by @${{ github.actor }}*
          EOF

      - name: Cleanup GitHub App Private Key
        if: always()
        run: |
          rm -f github-app-private-key.pem
          echo "GitHub App private key cleaned up."
